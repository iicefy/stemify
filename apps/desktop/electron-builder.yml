appId: com.stemify.app
productName: Stemify
copyright: Stemify

directories:
  output: release
  buildResources: assets

# better-sqlite3 v13 ships N-API prebuilds, so nothing needs rebuilding for
# Electron's ABI.
npmRebuild: false
nodeGypRebuild: false

files:
  - dist/main.mjs
  - package.json

# Everything the packaged app needs at runtime lives outside app.asar so the
# Python worker can read it with plain file access. The Python itself is
# per-platform (see mac/win below).
extraResources:
  - from: ../web/dist
    to: web
  - from: ../../worker/separate.py
    to: worker/separate.py
  - from: build/hf-home
    to: hf-home

mac:
  extraResources:
    - from: build/python
      to: python
  category: public.app-category.music
  icon: assets/icon.icns
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  # No Apple Developer ID: the build is ad-hoc signed, so it runs on the Mac
  # that built it. Sharing with other Macs needs a right-click > Open the
  # first time (or a paid signing identity + notarization).
  identity: null
  hardenedRuntime: false

dmg:
  title: Stemify

win:
  icon: assets/icon-1024.png
  extraResources:
    - from: build/python-win
      to: python
  target:
    - target: nsis
      arch: x64
  # Editing the .exe (icon, version info) needs Windows or Wine; building from
  # a Mac skips it, so the .exe keeps Electron's icon. Building on Windows
  # gives the full icon.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Stemify-Setup-${version}-x64.${ext}
